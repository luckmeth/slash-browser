<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Slash — Overlay</title>
    <!--
      The overlay view is composited above web content with a transparent
      background. html/body must stay transparent or the view paints an opaque
      sheet over the page and the whole point is lost.
    -->
    <style>
      html,
      body {
        background: transparent !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/overlay-entry.tsx"></script>
  </body>
</html>
